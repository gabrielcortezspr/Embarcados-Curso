; Every file in src/ is a standalone sketch with its own setup() and loop(),
; so only one of them is compiled at a time. Pick it here:
[activity]
file = atividade_01.cpp

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<${activity.file}>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
  bblanchon/ArduinoJson@^7.4.2
build_src_filter = -<*> +<${activity.file}>
